name: "Build CrossCode iOS"
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
      # ----------------------------------------------------------
      # Xcode
      # ----------------------------------------------------------
      - name: Check Xcode
        run: |
          xcodebuild -version
          xcode-select -p
      # ----------------------------------------------------------
      # Rust
      # ----------------------------------------------------------
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      # ----------------------------------------------------------
      # Cache Rust
      # ----------------------------------------------------------
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ios-crosscode-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ios-crosscode-
      # ----------------------------------------------------------
      # Bun
      # ----------------------------------------------------------
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      # ----------------------------------------------------------
      # Initialize Tauri iOS
      # ----------------------------------------------------------
      - name: Initialize Tauri iOS
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            bunx tauri ios init
          fi
      # ----------------------------------------------------------
      # Build IPA
      # ----------------------------------------------------------
      - name: Build iOS IPA
        run: |
          bunx tauri ios build
      # ----------------------------------------------------------
      # Locate IPA
      # ----------------------------------------------------------
      - name: Locate IPA
        run: |
          echo "Searching for IPA..."
          find src-tauri/gen/apple -type f -name "*.ipa" -print
          IPA=$(find src-tauri/gen/apple -type f -name "*.ipa" | head -n 1)
          if [ -z "$IPA" ]; then
            echo "ERROR: No IPA was generated."
            exit 1
          fi
          echo "IPA=$IPA" >> "$GITHUB_ENV"
      # ----------------------------------------------------------
      # Upload IPA to GitHub Release
      # ----------------------------------------------------------
      - name: Upload IPA to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          cp "$IPA" release-assets/CrossCode-iOS.ipa
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "release-assets/CrossCode-iOS.ipa" \
            --clobber
