name: Build Unsigned CrossCode iOS IPA (Manual)

on:
  workflow_dispatch:

jobs:
  build-crosscode-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun (Frontend PackageManager)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust Stable (For Tauri Backend)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build and Package with Tauri CLI
        run: |
          # Install the Tauri CLI
          bun add -g @tauri-apps/cli
          
          # Initialize iOS workspace properties if missing
          bun tauri ios init --no-interactive || true
          
          # Build the iOS bundle while explicitly bypassing Apple code signing
          bun tauri ios build --no-bundle-sign

      - name: Package App into Unsigned IPA
        run: |
          # Create iOS Payload folder structure
          mkdir -p $RUNNER_TEMP/Payload
          
          # Locates the generated .app bundle inside Tauri's default release output path
          # and copies it over to the Payload wrapper.
          find src-tauri/gen/apple/build/arm64 -name "*.app" -exec cp -R {} $RUNNER_TEMP/Payload/ \;
          
          # Compress into a sideloadable IPA archive
          cd $RUNNER_TEMP
          zip -r CrossCode-iOS-Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossCode-iOS-Unsigned
          path: ${{ runner.temp }}/CrossCode-iOS-Unsigned.ipa
          retention-days: 14
