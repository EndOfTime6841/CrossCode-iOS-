name: Build Unsigned CrossCode iOS IPA (Manual)

on:
  workflow_dispatch:

jobs:
  build-crosscode-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun (Frontend PackageManager)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust Stable (For Tauri Backend)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Frontend Dependencies
        run: bun install

      - name: Generate Tauri iOS Workspace Structure
        run: |
          # Install the Tauri v2 CLI globally
          bun add -g @tauri-apps/cli
          
          # '--ci' skips all developer team prompts during non-interactive environments
          bun tauri ios init --ci || true

      - name: Build Web Assets & Compile Rust Code
        run: |
          # Use `--open` tells Tauri to build assets and generate the raw Xcode workspace
          # without attempting Apple App Store validation signing
          bun tauri ios build --open || true

      - name: Build Unsigned Archive via xcodebuild
        run: |
          # Navigate into the workspace dynamically generated by Tauri's build step
          cd src-tauri/gen/apple
          
          # Force a compile without requiring certificates or distribution provisioning profiles
          xcodebuild archive \
            -workspace CrossCode_App.xcworkspace \
            -scheme CrossCode_App \
            -archivePath \$RUNNER_TEMP/CrossCode.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package App into Unsigned IPA
        run: |
          mkdir -p \$RUNNER_TEMP/Payload
          
          # Copy the freshly compiled app binary out of the archive
          cp -R \(RUNNER_TEMP/CrossCode.xcarchive/Products/Applications/*.app \)RUNNER_TEMP/Payload/
          
          # Wrap it into an installer ready for sideloading software
          cd \$RUNNER_TEMP
          zip -r CrossCode-iOS-Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossCode-iOS-Unsigned
          path: \${{ runner.temp }}/CrossCode-iOS-Unsigned.ipa
          retention-days: 14

