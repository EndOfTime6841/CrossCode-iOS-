name: Build Unsigned CrossCode iOS IPA (Manual)

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  build-crosscode-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun (Frontend PackageManager)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust Stable (For Tauri Backend)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios # Compiles the backend for iOS hardware

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Frontend Dependencies
        # Removed --frozen-lockfile so Bun can fix lockfile mismatches automatically
        run: bun install

      - name: Setup Tauri iOS Environment
        run: |
          # Installs the Tauri CLI globally and initializes iOS platform files if missing
          bun add -g @tauri-apps/cli
          bun tauri ios init --no-interactive || true

      - name: Build Unsigned iOS Archive via Xcode
        run: |
          # Navigate to Tauri's autogenerated iOS Xcode project workspace
          cd src-tauri/gen/apple
          
          xcodebuild archive \
            -workspace CrossCode_App.xcworkspace \
            -scheme CrossCode_App \
            -archivePath $RUNNER_TEMP/CrossCode.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package App into Unsigned IPA
        run: |
          # Create iOS Payload structure 
          mkdir -p $RUNNER_TEMP/Payload
          
          # Copy the compiled Tauri .app bundle into the Payload folder
          cp -R $RUNNER_TEMP/CrossCode.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          
          # Compress into a sideload-ready IPA file
          cd $RUNNER_TEMP
          zip -r CrossCode-iOS-Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossCode-iOS-Unsigned
          path: ${{ runner.temp }}/CrossCode-iOS-Unsigned.ipa
          retention-days: 365



