name: Build Unsigned CrossCode iOS IPA (Manual)

on:
  workflow_dispatch:

jobs:
  build-crosscode-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun (Frontend PackageManager)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust Stable (For Tauri Backend)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Frontend Dependencies & Force Plugins
        run: |
          bun install
          bun add -d @vitejs/plugin-react

      - name: Setup Tauri CLI & Build Web Assets
        run: |
          bun add -g @tauri-apps/cli
          # Build frontend assets into the dist folder manually so Tauri can see them
          bun run build

      - name: Force Generate Native iOS Files (XcodeGen)
        run: |
          # Install XcodeGen, which generates the project from Tauri's internal configuration
          brew install xcodegen
          
          # Initialize iOS project base
          bun tauri ios init --ci || true
          
          # Force create the directory structure if Tauri skipped it
          mkdir -p src-tauri/gen/apple
          
          # Run XcodeGen over Tauri's template project specification file
          cd src-tauri/gen/apple
          if [ -f project.yml ]; then
            xcodegen generate
          else
            # Fallback fallback if Tauri keeps configuration at the root
            cd ../../
            bun tauri ios init --ci || true
          fi

      - name: Build Unsigned Archive via xcodebuild
        run: |
          cd src-tauri/gen/apple
          
          # Dynamically capture workspace variables even if they change names
          WORKSPACE_NAME=$(ls -d *.xcworkspace 2>/dev/null | head -n 1 || ls -d *.xcodeproj 2>/dev/null | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE_NAME" | cut -f 1 -d '.')
          
          echo "Target File Identified: $WORKSPACE_NAME"
          echo "Target Scheme Identified: $SCHEME_NAME"
          
          # Determine flags based on file type (.xcodeproj vs .xcworkspace)
          if [[ "$WORKSPACE_NAME" == *.xcworkspace ]]; then
            TARGET_FLAG="-workspace $WORKSPACE_NAME"
          else
            TARGET_FLAG="-project $WORKSPACE_NAME"
          fi

          xcodebuild archive \
            $TARGET_FLAG \
            -scheme "$SCHEME_NAME" \
            -archivePath $RUNNER_TEMP/CrossCode.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package App into Unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          
          # Dynamically look for the .app file inside the generated archive target
          find $RUNNER_TEMP/CrossCode.xcarchive/Products/Applications/ -name "*.app" -exec cp -R {} $RUNNER_TEMP/Payload/ \;
          
          cd $RUNNER_TEMP
          zip -r CrossCode-iOS-Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossCode-iOS-Unsigned
          path: ${{ runner.temp }}/CrossCode-iOS-Unsigned.ipa
          retention-days: 14




