name: "Build CrossCode for iOS"
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
      # ----------------------------------------------------------
      # Xcode
      # ----------------------------------------------------------
      - name: Check Xcode
        run: |
          xcodebuild -version
          xcode-select -p
      # ----------------------------------------------------------
      # Rust
      # ----------------------------------------------------------
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      # ----------------------------------------------------------
      # Cache Rust
      # ----------------------------------------------------------
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ios-crosscode-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ios-crosscode-
      # ----------------------------------------------------------
      # Bun
      # ----------------------------------------------------------
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      # ----------------------------------------------------------
      # Initialize & Prepare Tauri iOS Assets
      # ----------------------------------------------------------
      - name: Initialize Tauri iOS
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            bunx tauri ios init
          fi
      # ----------------------------------------------------------
      # Build, Archive, and Package IPA
      # ----------------------------------------------------------
      - name: Build Unsigned iOS IPA
        run: |
          # 1. Fetch your Tauri app bundle name dynamically
          APP_NAME=$(node -e "const c = require('./src-tauri/tauri.conf.json'); console.log(c.productName || c.identifier.split('.').pop());")
          echo "Building app named: $APP_NAME"
          
          # 2. Build via xcodebuild, forcing Apple to skip signing
          xcodebuild archive \
            -project src-tauri/gen/apple/$APP_NAME.xcodeproj \
            -scheme "${APP_NAME}_iOS" \
            -archivePath src-tauri/gen/apple/build/App.xcarchive \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
            
          # 3. Create the payload structure required for an IPA package
          mkdir -p src-tauri/gen/apple/build/Payload
          cp -r src-tauri/gen/apple/build/App.xcarchive/Products/Applications/$APP_NAME.app src-tauri/gen/apple/build/Payload/
          
          # 4. Generate the final zipped .ipa archive
          cd src-tauri/gen/apple/build
          zip -r CrossCode-iOS.ipa Payload
          
          # 5. Export variables for the next pipeline steps
          echo "FINAL_IPA_PATH=$(pwd)/CrossCode-iOS.ipa" >> $GITHUB_ENV
      # ----------------------------------------------------------
      # Locate IPA
      # ----------------------------------------------------------
      - name: Locate IPA
        run: |
          echo "Searching for IPA..."
          if [ ! -f "$FINAL_IPA_PATH" ]; then
            echo "ERROR: No IPA was generated."
            exit 1
          fi
          echo "IPA=$FINAL_IPA_PATH" >> "$GITHUB_ENV"
      # ----------------------------------------------------------
      # Upload IPA to GitHub Release
      # ----------------------------------------------------------
      - name: Upload IPA to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          cp "$IPA" release-assets/CrossCode-iOS.ipa
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "release-assets/CrossCode-iOS.ipa" \
            --clobber

