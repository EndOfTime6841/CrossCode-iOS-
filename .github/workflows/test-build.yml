name: Build Unsigned CrossCode iOS IPA

on:
  workflow_dispatch:

jobs:
  build-crosscode-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        run: |
          bun install

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Cache Swift toolchain
        id: swift-cache
        uses: actions/cache@v4
        with:
          path: /Library/Developer/Toolchains
          key: swift-toolchain-6.2-macos-${{ runner.arch }}

      - name: Install Swift toolchain
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://download.swift.org/swift-6.2-release/xcode/swift-6.2-RELEASE/swift-6.2-RELEASE-osx.pkg -o swift.pkg
          sudo installer -pkg swift.pkg -target /

      - name: Select Swift toolchain
        run: |
          echo "TOOLCHAINS=swift" >> "$GITHUB_ENV"

      - name: Verify Toolchains
        run: |
          echo "=============================="
          echo "Bun"
          echo "=============================="
          bun --version
          echo "=============================="
          echo "Rust"
          echo "=============================="
          rustc --version
          cargo --version
          rustup target list --installed
          echo "=============================="
          echo "Xcode"
          echo "=============================="
          xcodebuild -version
          xcode-select -p
          echo "=============================="
          echo "Swift"
          echo "=============================="
          swift --version
          echo "=============================="
          echo "iOS SDK"
          echo "=============================="
          xcrun --sdk iphoneos --show-sdk-version
          echo "=============================="
          echo "Available iOS SDKs"
          echo "=============================="
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Verify Project
        run: |
          echo "=============================="
          echo "Repository"
          echo "=============================="
          pwd
          ls -la
          echo "=============================="
          echo "package.json"
          echo "=============================="
          cat package.json
          echo "=============================="
          echo "src-tauri"
          echo "=============================="
          if [ -d src-tauri ]; then
            find src-tauri -maxdepth 3 -type f | sort
          else
            echo "ERROR: src-tauri directory not found"
            exit 1
          fi

      - name: Verify Vite React Plugin
        run: |
          bun install
          echo "Checking @vitejs/plugin-react..."
          if bun pm ls @vitejs/plugin-react; then
            echo "@vitejs/plugin-react is installed"
          else
            echo "ERROR: @vitejs/plugin-react is missing"
            exit 1
          fi

      - name: Install Native Image Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install vips

      - name: Run Tauri CLI
        run: bunx tauri --version

      - name: Verify Tauri CLI
        run: |
          bunx tauri --version

      - name: Print Tauri iOS Build Help
        run: |
          bunx tauri ios build --help

      - name: Build Web Assets
        run: |
          bun run build

      - name: Initialize Tauri iOS
        run: |
          bunx tauri ios init --ci

      - name: Install XcodeGen
        run: |
          brew install xcodegen
      - name: Regenerate Cargo.lock
        working-directory: src-tauri
        run: |
          cargo update -p idevice --precise 0.1.47
          cargo update -p isideload --precise 0.1.17
          cargo tree -p idevice -p isideload

      - name: Build iOS App (Unsigned)
        shell: bash
        env:
          CI: "true"
        run: |
          bunx tauri ios build --target aarch64 --no-sign --verbose

      - name: Locate Built App
        shell: bash
        run: |
          APP_PATH=$(find \
            src-tauri/gen/apple \
            -maxdepth 6 \
            -name "*.app" \
            -type d \
            -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found after tauri ios build"
            find src-tauri/gen/apple -maxdepth 6 -print
            exit 1
          fi
          echo "Found application:"
          echo "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Verify App Bundle
        shell: bash
        run: |
          echo "=============================="
          echo "Application"
          echo "=============================="
          ls -lah "$APP_PATH"
          echo "=============================="
          echo "Info.plist"
          echo "=============================="
          if [ -f "$APP_PATH/Info.plist" ]; then
            echo "Bundle identifier:"
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP_PATH/Info.plist" || true
            echo "Display name:"
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleDisplayName" \
              "$APP_PATH/Info.plist" || true
            echo "Version:"
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$APP_PATH/Info.plist" || true
            echo "Build:"
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$APP_PATH/Info.plist" || true
          else
            echo "ERROR: Info.plist not found"
            exit 1
          fi

      - name: Package Unsigned IPA
        shell: bash
        run: |
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          IPA_PATH="$RUNNER_TEMP/CrossCode-iOS-Unsigned.ipa"
          echo "=============================="
          echo "Packaging IPA"
          echo "=============================="
          rm -rf "$PAYLOAD_DIR"
          rm -f "$IPA_PATH"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          cd "$RUNNER_TEMP"
          zip -r \
            "$IPA_PATH" \
            Payload
          echo "=============================="
          echo "Created IPA"
          echo "=============================="
          ls -lh "$IPA_PATH"

      - name: Verify IPA
        shell: bash
        run: |
          IPA_PATH="$RUNNER_TEMP/CrossCode-iOS-Unsigned.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: IPA was not created"
            exit 1
          fi
          echo "=============================="
          echo "IPA contents"
          echo "=============================="
          unzip -l "$IPA_PATH"
          echo "=============================="
          echo "IPA size"
          echo "=============================="
          du -h "$IPA_PATH"
      - name: Verify Info.plist keys
        shell: bash
        run: |
          echo "=============================="
          echo "Full Info.plist dump"
          echo "=============================="
          /usr/libexec/PlistBuddy -c "Print" "$APP_PATH/Info.plist"
          echo "=============================="
          echo "Checking specific keys"
          echo "=============================="
          /usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$APP_PATH/Info.plist" || echo "UIFileSharingEnabled: MISSING"
          /usr/libexec/PlistBuddy -c "Print :LSSupportsOpeningDocumentsInPlace" "$APP_PATH/Info.plist" || echo "LSSupportsOpeningDocumentsInPlace: MISSING"

    

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CrossCode-iOS-Unsigned
          path: ${{ runner.temp }}/CrossCode-iOS-Unsigned.ipa
          retention-days: 14


