name: Build Unsigned CrossCode iOS IPA

on:
  workflow_dispatch:

jobs:
  build-crosscode-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        run: |
          bun install

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Install Swift toolchain
        run: |
          curl -fsSL https://download.swift.org/swift-6.2-release/xcode/swift-6.2-RELEASE/swift-6.2-RELEASE-osx.pkg -o swift.pkg
          sudo installer -pkg swift.pkg -target /
          echo "TOOLCHAINS=swift" >> "$GITHUB_ENV"

      - name: Verify Toolchains
        run: |
          echo "=============================="
          echo "Bun"
          echo "=============================="
          bun --version
          echo "=============================="
          echo "Rust"
          echo "=============================="
          rustc --version
          cargo --version
          rustup target list --installed
          echo "=============================="
          echo "Xcode"
          echo "=============================="
          xcodebuild -version
          xcode-select -p
          echo "=============================="
          echo "Swift"
          echo "=============================="
          swift --version
          echo "=============================="
          echo "iOS SDK"
          echo "=============================="
          xcrun --sdk iphoneos --show-sdk-version
          echo "=============================="
          echo "Available iOS SDKs"
          echo "=============================="
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Verify Project
        run: |
          echo "=============================="
          echo "Repository"
          echo "=============================="
          pwd
          ls -la
          echo "=============================="
          echo "package.json"
          echo "=============================="
          cat package.json
          echo "=============================="
          echo "src-tauri"
          echo "=============================="
          if [ -d src-tauri ]; then
            find src-tauri -maxdepth 3 -type f | sort
          else
            echo "ERROR: src-tauri directory not found"
            exit 1
          fi

      - name: Verify Vite React Plugin
        run: |
          bun install
          echo "Checking @vitejs/plugin-react..."
          if bun pm ls @vitejs/plugin-react; then
            echo "@vitejs/plugin-react is installed"
          else
            echo "ERROR: @vitejs/plugin-react is missing"
            exit 1
          fi

      - name: Install Native Image Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install vips

      - name: Run Tauri CLI
        run: bunx tauri --version

      - name: Verify Tauri CLI
        run: |
          bunx tauri --version

      - name: Build Web Assets
        run: |
          bun run build

      - name: Initialize Tauri iOS
        run: |
          bunx tauri ios init --ci

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        shell: bash
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            echo "ERROR: src-tauri/gen/apple does not exist"
            exit 1
          fi
          cd src-tauri/gen/apple
          echo "Current directory:"
          pwd
          echo "Files:"
          find . -maxdepth 2 -type f | sort
          if [ -f project.yml ]; then
            echo "project.yml found"
            echo "Generating Xcode project..."
            xcodegen generate
          else
            echo "No project.yml found"
            echo "Using Tauri-generated Xcode project"
          fi

      - name: Inspect Generated iOS Project
        shell: bash
        run: |
          cd src-tauri/gen/apple
          echo "=============================="
          echo "Generated iOS files"
          echo "=============================="
          find . -maxdepth 3 \
            \( \
              -name "*.xcodeproj" \
              -o -name "*.xcworkspace" \
              -o -name "project.yml" \
            \) \
            -print

      - name: Detect Xcode Workspace or Project
        id: xcode
        shell: bash
        run: |
          cd src-tauri/gen/apple
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" -print -quit)

          if [ -n "$WORKSPACE" ]; then
            WORKSPACE="${WORKSPACE#./}"
            echo "type=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"
            SCHEME_LIST=$(xcodebuild -workspace "$WORKSPACE" -list -json)
          elif [ -n "$PROJECT" ]; then
            PROJECT="${PROJECT#./}"
            echo "type=project" >> "$GITHUB_OUTPUT"
            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
            SCHEME_LIST=$(xcodebuild -project "$PROJECT" -list -json)
          else
            echo "ERROR: No Xcode workspace or project found"
            exit 1
          fi

          echo "Raw scheme list:"
          echo "$SCHEME_LIST"

          # Prefer a scheme ending in _iOS (Tauri's convention), else fall back to the first scheme
          SCHEME=$(echo "$SCHEME_LIST" | ruby -rjson -e '
            data = JSON.parse(STDIN.read)
            schemes = data["project"]["schemes"] rescue data["workspace"]["schemes"]
            picked = schemes.find { |s| s.end_with?("_iOS") } || schemes.first
            puts picked
          ')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Could not determine a scheme"
            exit 1
          fi

          echo "Detected scheme: $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: List Xcode Schemes
        shell: bash
        run: |
          cd src-tauri/gen/apple
          echo "=============================="
          echo "Available Xcode schemes"
          echo "=============================="
          if [ "${{ steps.xcode.outputs.type }}" = "workspace" ]; then
            xcodebuild \
              -workspace "${{ steps.xcode.outputs.path }}" \
              -list
          else
            xcodebuild \
              -project "${{ steps.xcode.outputs.path }}" \
              -list
          fi

      - name: Build Unsigned iOS Archive
        shell: bash
        run: |
          cd src-tauri/gen/apple
          ARCHIVE_PATH="$RUNNER_TEMP/CrossCode.xcarchive"
          echo "=============================="
          echo "Building unsigned archive"
          echo "=============================="
          echo "Archive:"
          echo "$ARCHIVE_PATH"
          if [ "${{ steps.xcode.outputs.type }}" = "workspace" ]; then
            xcodebuild archive \
              -workspace "${{ steps.xcode.outputs.path }}" \
              -scheme "${{ steps.xcode.outputs.scheme }}" \
              -archivePath "$ARCHIVE_PATH" \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER=""
          else
            xcodebuild archive \
              -project "${{ steps.xcode.outputs.path }}" \
              -scheme "${{ steps.xcode.outputs.scheme }}" \
              -archivePath "$ARCHIVE_PATH" \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER=""
          fi

      - name: Inspect Archive
        shell: bash
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/CrossCode.xcarchive"
          echo "=============================="
          echo "Archive contents"
          echo "=============================="
          find "$ARCHIVE_PATH" \
            -maxdepth 6 \
            -print | head -300
          echo "=============================="
          echo "Applications"
          echo "=============================="
          find "$ARCHIVE_PATH/Products/Applications" \
            -maxdepth 2 \
            -name "*.app" \
            -type d \
            -print

      - name: Locate Built App
        shell: bash
        run: |
          APP_PATH=$(find \
            "$RUNNER_TEMP/CrossCode.xcarchive/Products/Applications" \
            -maxdepth 2 \
            -name "*.app" \
            -type d \
            -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive"
            exit 1
          fi
          echo "Found application:"
          echo "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Verify App Bundle
        shell: bash
        run: |
          echo "=============================="
          echo "Application"
          echo "=============================="
          ls -lah "$APP_PATH"
          echo "=============================="
          echo "Info.plist"
          echo "=============================="
          if [ -f "$APP_PATH/Info.plist" ]; then
            echo "Bundle identifier:"
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP_PATH/Info.plist" || true
            echo "Display name:"
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleDisplayName" \
              "$APP_PATH/Info.plist" || true
            echo "Version:"
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$APP_PATH/Info.plist" || true
            echo "Build:"
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "$APP_PATH/Info.plist" || true
          else
            echo "ERROR: Info.plist not found"
            exit 1
          fi

      - name: Package Unsigned IPA
        shell: bash
        run: |
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          IPA_PATH="$RUNNER_TEMP/CrossCode-iOS-Unsigned.ipa"
          echo "=============================="
          echo "Packaging IPA"
          echo "=============================="
          rm -rf "$PAYLOAD_DIR"
          rm -f "$IPA_PATH"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          cd "$RUNNER_TEMP"
          zip -r \
            "$IPA_PATH" \
            Payload
          echo "=============================="
          echo "Created IPA"
          echo "=============================="
          ls -lh "$IPA_PATH"

      - name: Verify IPA
        shell: bash
        run: |
          IPA_PATH="$RUNNER_TEMP/CrossCode-iOS-Unsigned.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: IPA was not created"
            exit 1
          fi
          echo "=============================="
          echo "IPA contents"
          echo "=============================="
          unzip -l "$IPA_PATH"
          echo "=============================="
          echo "IPA size"
          echo "=============================="
          du -h "$IPA_PATH"

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CrossCode-iOS-Unsigned
          path: ${{ runner.temp }}/CrossCode-iOS-Unsigned.ipa
          retention-days: 14

