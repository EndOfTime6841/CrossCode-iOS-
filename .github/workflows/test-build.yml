name: Build Unsigned CrossCode iOS IPA

on:
  workflow_dispatch:

jobs:
  build-crosscode-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        run: |
          bun install

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Verify Toolchains
        run: |
          echo "=============================="
          echo "Bun"
          echo "=============================="
          bun --version
          echo "=============================="
          echo "Rust"
          echo "=============================="
          rustc --version
          cargo --version
          rustup target list --installed
          echo "=============================="
          echo "Xcode"
          echo "=============================="
          xcodebuild -version
          xcode-select -p
          echo "=============================="
          echo "iOS SDK"
          echo "=============================="
          xcrun --sdk iphoneos --show-sdk-version
          echo "=============================="
          echo "Available iOS SDKs"
          echo "=============================="
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Verify Project
        run: |
          echo "=============================="
          echo "Repository"
          echo "=============================="
          pwd
          ls -la
          echo "=============================="
          echo "package.json"
          echo "=============================="
          cat package.json
          echo "=============================="
          echo "src-tauri"
          echo "=============================="
          if [ -d src-tauri ]; then
            find src-tauri -maxdepth 3 -type f | sort
          else
            echo "ERROR: src-tauri directory not found"
            exit 1
          fi

      - name: Verify Vite React Plugin
        run: |
          bun install
          echo "Checking @vitejs/plugin-react..."
          if bun pm ls @vitejs/plugin-react; then
            echo "@vitejs/plugin-react is installed"
          else
            echo "ERROR: @vitejs/plugin-react is missing"
            exit 1
          fi

      - name: Install Native Image Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install vips

      - name: Run Tauri CLI
        run: bunx @tauri-apps/cli@latest --version

      - name: Build Web Assets
        run: |
          bun run build

      - name: Initialize Tauri iOS
        run: |
          bunx @tauri-apps/cli@latest ios init --ci

      - name: Build Unsigned iOS IPA (via Tauri CLI)
        shell: bash
        run: |
          echo "=============================="
          echo "Building unsigned iOS IPA"
          echo "=============================="
          # Let the Tauri CLI itself drive xcodebuild. It starts a local
          # control server and writes its address to a temp file that the
          # Xcode 'Build Rust Code' script phase reads back over IPC - that
          # handshake only happens when 'tauri' is the parent process, which
          # is why calling `xcodebuild archive` directly (bypassing this)
          # made the script phase abort with a missing-addr-file panic.
          bunx @tauri-apps/cli@latest ios build --no-sign --target aarch64

      - name: Locate Built IPA
        shell: bash
        run: |
          IPA_PATH=$(find src-tauri/gen/apple -maxdepth 4 -name "*.ipa" -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No .ipa found under src-tauri/gen/apple"
            echo "Searched tree:"
            find src-tauri/gen/apple -maxdepth 4 -type f | sort
            exit 1
          fi
          echo "Found IPA:"
          echo "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Verify IPA
        shell: bash
        run: |
          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: IPA path does not exist: $IPA_PATH"
            exit 1
          fi
          echo "=============================="
          echo "IPA contents"
          echo "=============================="
          unzip -l "$IPA_PATH"
          echo "=============================="
          echo "IPA size"
          echo "=============================="
          du -h "$IPA_PATH"

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CrossCode-iOS-Unsigned
          path: ${{ env.IPA_PATH }}
          retention-days: 14
