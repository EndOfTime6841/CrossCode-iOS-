name: Build Unsigned CrossCode iOS IPA

on:
  workflow_dispatch:

jobs:
  build-crosscode-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        run: bun install

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Verify Toolchains
        run: |
          echo "=== Bun ==="
          bun --version

          echo "=== Rust ==="
          rustc --version
          cargo --version

          echo "=== Xcode ==="
          xcodebuild -version
          xcode-select -p

          echo "=== iOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-version

          echo "=== Available iOS SDK ==="
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Verify Project
        run: |
          echo "=== Repository ==="
          pwd
          ls -la

          echo "=== package.json ==="
          if [ -f package.json ]; then
            cat package.json
          fi

          echo "=== src-tauri ==="
          if [ -d src-tauri ]; then
            find src-tauri -maxdepth 2 -type f | sort
          fi

      - name: Verify Tauri CLI
        run: |
          bunx tauri --version

      - name: Build Web Assets
        run: |
          bun run build

      - name: Initialize Tauri iOS
        run: |
          bunx tauri ios init --ci

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        shell: bash
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            echo "src-tauri/gen/apple does not exist"
            exit 1
          fi

          cd src-tauri/gen/apple

          if [ -f project.yml ]; then
            echo "project.yml found"
            xcodegen generate
          else
            echo "No project.yml found"
            echo "Using Tauri-generated Xcode project"
          fi

      - name: Inspect Generated iOS Project
        shell: bash
        run: |
          cd src-tauri/gen/apple

          echo "=== Generated files ==="
          find . -maxdepth 2 \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "project.yml" \) \
            -print

      - name: Detect Xcode Workspace or Project
        id: xcode
        shell: bash
        run: |
          cd src-tauri/gen/apple

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" -print -quit)

          if [ -n "$WORKSPACE" ]; then
            WORKSPACE="${WORKSPACE#./}"

            echo "type=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "scheme=$(basename "$WORKSPACE" .xcworkspace)" >> "$GITHUB_OUTPUT"

            echo "Detected workspace:"
            echo "$WORKSPACE"

            echo "Detected scheme:"
            basename "$WORKSPACE" .xcworkspace

          elif [ -n "$PROJECT" ]; then
            PROJECT="${PROJECT#./}"

            echo "type=project" >> "$GITHUB_OUTPUT"
            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
            echo "scheme=$(basename "$PROJECT" .xcodeproj)" >> "$GITHUB_OUTPUT"

            echo "Detected project:"
            echo "$PROJECT"

            echo "Detected scheme:"
            basename "$PROJECT" .xcodeproj

          else
            echo "No Xcode workspace or project found"
            exit 1
          fi

      - name: List Xcode Schemes
        shell: bash
        run: |
          cd src-tauri/gen/apple

          if [ "${{ steps.xcode.outputs.type }}" = "workspace" ]; then
            xcodebuild \
              -workspace "${{ steps.xcode.outputs.path }}" \
              -list
          else
            xcodebuild \
              -project "${{ steps.xcode.outputs.path }}" \
              -list
          fi

      - name: Build Unsigned iOS Archive
        shell: bash
        run: |
          cd src-tauri/gen/apple

          ARCHIVE_PATH="$RUNNER_TEMP/CrossCode.xcarchive"

          echo "Archive path:"
          echo "$ARCHIVE_PATH"

          if [ "${{ steps.xcode.outputs.type }}" = "workspace" ]; then

            xcodebuild archive \
              -workspace "${{ steps.xcode.outputs.path }}" \
              -scheme "${{ steps.xcode.outputs.scheme }}" \
              -archivePath "$ARCHIVE_PATH" \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER=""

          else

            xcodebuild archive \
              -project "${{ steps.xcode.outputs.path }}" \
              -scheme "${{ steps.xcode.outputs.scheme }}" \
              -archivePath "$ARCHIVE_PATH" \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER=""

          fi

      - name: Inspect Archive
        shell: bash
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/CrossCode.xcarchive"

          echo "=== Archive contents ==="
          find "$ARCHIVE_PATH" -maxdepth 5 -print | head -200

          echo "=== Applications ==="
          find "$ARCHIVE_PATH/Products/Applications" \
            -maxdepth 2 \
            -name "*.app" \
            -type d \
            -print

      - name: Locate Built App
        shell: bash
        run: |
          APP_PATH=$(find \
            "$RUNNER_TEMP/CrossCode.xcarchive/Products/Applications" \
            -maxdepth 2 \
            -name "*.app" \
            -type d \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive"
            exit 1
          fi

          echo "Found application:"
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Verify App Bundle
        shell: bash
        run: |
          echo "=== App ==="
          ls -lah "$APP_PATH"

          echo "=== Info.plist ==="
          if [ -f "$APP_PATH/Info.plist" ]; then
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP_PATH/Info.plist" || true

            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleDisplayName" \
              "$APP_PATH/Info.plist" || true
          fi

      - name: Package Unsigned IPA
        shell: bash
        run: |
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          IPA_PATH="$RUNNER_TEMP/CrossCode-iOS-Unsigned.ipa"

          rm -rf "$PAYLOAD_DIR"
          rm -f "$IPA_PATH"

          mkdir -p "$PAYLOAD_DIR"

          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          cd "$RUNNER_TEMP"

          zip -r \
            "$IPA_PATH" \
            Payload

          echo "Created IPA:"
          ls -lh "$IPA_PATH"

      - name: Verify IPA
        shell: bash
        run: |
          IPA_PATH="$RUNNER_TEMP/CrossCode-iOS-Unsigned.ipa"

          if [ ! -f "$IPA_PATH" ]; then
            echo "IPA was not created"
            exit 1
          fi

          echo "=== IPA contents ==="
          unzip -l "$IPA_PATH"

          echo "=== IPA size ==="
          du -h "$IPA_PATH"

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CrossCode-iOS-Unsigned
          path: ${{ runner.temp }}/CrossCode-iOS-Unsigned.ipa
          retention-days: 14
