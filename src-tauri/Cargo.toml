[package]
name = "crosscode"
version = "0.0.5"
description = "Cross platform iOS IDE"
authors = ["nab138"]
edition = "2021"

# Tauri's iOS builder invokes Cargo with --lib. Use the shared application
# entry point directly so the library target includes the complete module tree.
[lib]
name = "crosscode"
path = "src/main.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-cli = "2.4.0"
tauri-plugin-updater = "2.9.0"
tauri-plugin-shell = "2.3.0"
tauri-plugin-fs = { version = "2.4.2", features = ["watch"] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-store = "2.4.0"
tauri-plugin-opener = "2.5.0"
tauri-plugin-os = "2.3.1"
tauri-plugin-process = "2.3.0"
idevice = { version = "=0.1.47", features = ["usbmuxd", "syslog_relay", "core_device_proxy", "tunnel_tcp_stack", "rsd", "core_device", "dvt", "mobile_image_mounter", "tss", "ring"], default-features = false }
futures = "0.3.31"
keyring = "2"
once_cell = "1.21.3"
zip = { version = "4.5", default-features = false, features = ["deflate"] }
isideload = { version = "=0.1.17", features = ["vendored-openssl"] }
walkdir = "2.5.0"
dircpy = "0.3.19"
tar = "0.4.44"
reqwest = "0.12.23"
flate2 = "1.1.2"
regex = "1"
toml = "0.9.5"
tokio = { version = "1.47.1", features = ["process"] }
futures-util = "0.3.31"
sysinfo = "0.37.0"
tokio-util = "0.7.16"
image = "0.25.6"
unxip-rs = "0.1.1"
tokio-tungstenite = "0.28.0"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }

[target.'cfg(unix)'.dependencies]
sdkmover = { path = "../sdkmover" }

[features]
custom-protocol = ["tauri/custom-protocol"]
